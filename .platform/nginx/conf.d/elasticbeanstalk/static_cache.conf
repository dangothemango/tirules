# Fonts and images never change in place, so browsers and CloudFront keep them for a year.
# Replacing one means giving it a new file name (and updating style.css or the page).
location ~* \.(woff2|png)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# style.css is linked as /style.css?v=<mtime>, so each edit gets a new URL. CloudFront's cache
# policy must include query strings in the cache key (UseOriginCacheControlHeaders-QueryStrings),
# or it would keep serving the old stylesheet.
location = /style.css {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
